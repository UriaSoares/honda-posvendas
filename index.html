<!DOCTYPE html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="robots" content="noindex,nofollow"><title>Caiobá Honda | Catálogo de peças linha CG</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Mulish:wght@400;600;700;800;900&family=Saira:ital,wght@0,700;0,800;1,800;1,900&family=Saira+Condensed:wght@700;800&display=swap" rel="stylesheet">
<style>

:root{
  --caioba-blue:#1060B0;--caioba-blue-700:#0B4C8C;--caioba-blue-900:#082F58;--caioba-blue-100:#DCE9F6;
  --caioba-yellow:#FBB814;--caioba-yellow-600:#E0A005;--caioba-yellow-100:#FFF1CC;--honda-red:#CC0000;
  --red:var(--caioba-blue);--red-d:var(--caioba-blue-700);--ink:#0F1115;--ink-700:#2A2F36;--steel:#5A6271;--line:#E5E8EE;
  --paper:#FFFFFF;--panel:#F7F8FA;--hl:var(--caioba-yellow-100);--ok:#1A9D6B;--bg:#F7F8FA;
  --sans:"Mulish",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  --cond:"Saira Condensed","Saira","Arial Narrow",Arial,sans-serif;--disp:"Saira","Saira Condensed",system-ui,sans-serif;
  --r-sm:6px;--r-md:12px;--r-pill:999px;--shadow-sm:0 1px 2px rgba(15,17,21,.06),0 1px 1px rgba(15,17,21,.04);--shadow-brand:0 10px 24px rgba(16,96,176,.25);
  --ease-out:cubic-bezier(0.22,1,0.36,1);--dur:220ms;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--ink:#E8EAED;--ink-700:#C9CED6;--steel:#A3ABB8;--line:#2E343C;--paper:#161A20;--panel:#1D222A;--bg:#11151A;--hl:#3A3016;--caioba-blue-100:#16304D}}
:root[data-theme="dark"]{--ink:#E8EAED;--ink-700:#C9CED6;--steel:#A3ABB8;--line:#2E343C;--paper:#161A20;--panel:#1D222A;--bg:#11151A;--hl:#3A3016;--caioba-blue-100:#16304D}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 var(--sans)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--red);outline-offset:2px}
.hidden{display:none!important}

/* header */
header.top{background:var(--red);color:#fff;display:flex;align-items:center;gap:18px;padding:10px 18px;flex-wrap:wrap}
.brand{font:700 22px/1 var(--cond);letter-spacing:.5px;white-space:nowrap}
.brand small{display:block;font:500 13px/1.2 var(--sans);opacity:.85;letter-spacing:0}
nav.tabs{display:flex;gap:4px;margin-left:auto;flex-wrap:wrap}
nav.tabs button{background:transparent;border:0;color:#fff;padding:8px 14px;border-radius:6px;font-weight:600;opacity:.8}
nav.tabs button[aria-selected="true"]{background:#fff;color:var(--red);opacity:1}
.verbar{display:flex;gap:10px;align-items:center;padding:10px 18px;background:var(--paper);border-bottom:1px solid var(--line);flex-wrap:wrap}
.verbar label{font-weight:600;color:var(--steel)}
select,input[type=text],input[type=tel],input[type=url],textarea{background:var(--paper);border:1px solid var(--line);border-radius:6px;padding:7px 10px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.seg button{border:0;background:var(--paper);padding:7px 14px;font-weight:600;color:var(--steel)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}

/* catalog layout */
.cat{display:grid;grid-template-columns:230px minmax(0,1fr) 380px;gap:0;min-height:calc(100vh - 120px)}
.blocks{background:var(--paper);border-right:1px solid var(--line);overflow:auto;max-height:calc(100vh - 120px)}
.blocks button{display:flex;gap:10px;width:100%;text-align:left;border:0;border-bottom:1px solid var(--line);background:transparent;padding:9px 14px;align-items:baseline}
.blocks button .bid{font:600 14px var(--cond);color:var(--steel);min-width:52px}
.blocks button[aria-current="true"]{background:var(--hl);color:#1D1F22}
.blocks button[aria-current="true"] .bid{color:#1D1F22}
.grp{font:700 13px var(--cond);color:var(--red);padding:12px 14px 4px;letter-spacing:.3px}
.stage{padding:16px;overflow:auto}
.stage h2{margin:0 0 2px;font:700 26px/1.1 var(--cond)}
.stage .sub{color:var(--steel);margin:0 0 12px}
.draw{position:relative;background:#fff;border:1px solid var(--line);border-radius:8px;overflow:hidden;touch-action:manipulation}
.draw img{display:block;width:100%;height:auto;user-select:none;-webkit-user-drag:none}
.wm{position:absolute;right:10px;bottom:8px;font:600 12px var(--cond);color:#8a9099;pointer-events:none;background:rgba(255,255,255,.85);padding:2px 6px;border-radius:4px}
.hs{position:absolute;transform:translate(-50%,-50%);width:4.2%;min-width:26px;aspect-ratio:1;border-radius:50%;border:2.5px solid var(--red);background:rgba(204,0,0,.06);padding:0}
.hs:hover{background:rgba(204,0,0,.18)}
.hs.on{background:rgba(255,228,92,.55);border-color:#1D1F22}
.hs.added::after{content:"";position:absolute;right:-5px;top:-5px;width:11px;height:11px;border-radius:50%;background:var(--ok);border:2px solid #fff}
.editing .hs{border-style:dashed}
.side{background:var(--paper);border-left:1px solid var(--line);display:flex;flex-direction:column;max-height:calc(100vh - 120px)}
.parts{overflow:auto;flex:1}
.prow{display:grid;grid-template-columns:34px 1fr auto;gap:8px;padding:9px 14px;border-bottom:1px solid var(--line);align-items:center}
.prow.on{background:var(--hl);color:#1D1F22}
.prow .ref{font:700 16px var(--cond);text-align:center;border:1.5px solid var(--red);border-radius:50%;width:30px;height:30px;line-height:27px;color:var(--red);background:var(--paper)}
.prow .pn{font:600 14px var(--cond);color:var(--steel);font-variant-numeric:tabular-nums}
.prow.on .pn{color:#3a3f46}
.prow .d{font-weight:500}
.prow .note{font-size:12.5px;color:var(--steel)}
.prow.on .note{color:#3a3f46}
.add{border:1.5px solid var(--red);background:var(--paper);color:var(--red);border-radius:6px;padding:5px 10px;font-weight:700;white-space:nowrap}
.add.in{background:var(--ok);border-color:var(--ok);color:#fff}
.cart{border-top:2px solid var(--ink);padding:12px 14px;background:var(--panel)}
.cart h3{margin:0 0 6px;font:700 18px var(--cond)}
.citem{display:grid;grid-template-columns:1fr auto;gap:6px;align-items:center;padding:5px 0;border-bottom:1px dashed var(--line);font-size:14px}
.citem .pn{font:600 13px var(--cond);color:var(--steel)}
.qty{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:6px;background:var(--paper)}
.qty button{border:0;background:transparent;width:28px;height:28px;font-weight:700}
.qty span{min-width:22px;text-align:center;font-variant-numeric:tabular-nums;font-weight:600}
.btn{border:0;border-radius:6px;padding:10px 16px;font-weight:700;background:var(--red);color:#fff}
.btn:hover{background:var(--red-d)}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.btn.wa{background:#1E7A46}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.muted{color:var(--steel)}
.empty{padding:24px 14px;color:var(--steel)}

/* forms pages */
.page{max-width:980px;margin:0 auto;padding:22px 18px 60px}
.page h2{font:700 28px/1.1 var(--cond);margin:0 0 6px}
.card{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:18px;margin:16px 0}
.fgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}
.f label{display:block;font-weight:600;font-size:13.5px;margin-bottom:4px;color:var(--steel)}
.f input,.f select,.f textarea{width:100%}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chip{border:1px solid var(--line);background:var(--paper);border-radius:999px;padding:5px 11px;font-size:13.5px}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.chip b{font-family:var(--cond);margin-right:4px}
.linkbox{font:500 13px/1.4 ui-monospace,Menlo,monospace;word-break:break-all;background:var(--panel);padding:10px;border-radius:6px;max-height:90px;overflow:auto}
table.mw{width:100%;border-collapse:collapse}
table.mw th{text-align:left;font:700 14px var(--cond);color:var(--steel);border-bottom:2px solid var(--ink);padding:8px 6px}
table.mw td{border-bottom:1px solid var(--line);padding:9px 6px;vertical-align:middle}
table.mw tr.done td{opacity:.45;text-decoration:line-through}
table.mw tr.done td:first-child,table.mw tr.done td.cp{text-decoration:none}
.code{font:700 17px var(--cond);letter-spacing:.3px;font-variant-numeric:tabular-nums}
.copy{border:1.5px solid var(--ink);background:var(--paper);border-radius:6px;padding:6px 12px;font-weight:700}
.copy.ok{background:var(--ok);color:#fff;border-color:var(--ok)}
.qbig{font:700 20px var(--cond);text-align:center}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:#1D1F22;color:#fff;padding:10px 16px;border-radius:8px;font-weight:600;z-index:50}

/* client */
.client header.top nav{display:none}
.cl-hello{background:var(--paper);padding:14px 18px;border-bottom:1px solid var(--line)}
.cl-hello h1{margin:0;font:700 24px/1.15 var(--cond)}
.cl-hello p{margin:4px 0 0;color:var(--steel)}
.cl-tabs{display:flex;gap:6px;overflow-x:auto;padding:10px 14px;background:var(--paper);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
.cl-tabs button{flex:0 0 auto;border:1px solid var(--line);background:var(--paper);border-radius:999px;padding:7px 13px;font-weight:600;font-size:14px}
.cl-tabs button[aria-current="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.cl-main{max-width:900px;margin:0 auto;padding:12px 12px 110px}
.cl-main .draw{margin-bottom:12px}
.cl-list{background:var(--paper);border:1px solid var(--line);border-radius:8px;overflow:hidden}
.bar{position:fixed;left:0;right:0;bottom:0;background:var(--ink);color:var(--paper);display:flex;align-items:center;gap:12px;padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));z-index:20}
.bar .btn{margin-left:auto}
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:30;display:flex;align-items:flex-end;justify-content:center}
.sheet .in{background:var(--paper);width:100%;max-width:640px;max-height:88%;overflow:auto;border-radius:14px 14px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom,0px))}
.sheet h3{margin:0 0 8px;font:700 22px var(--cond)}
.expired{max-width:520px;margin:60px auto;text-align:center;padding:20px}

@media (max-width:720px){.cat{grid-template-columns:1fr}.blocks{max-height:220px;border-right:0}.stage{padding:10px}.hs{min-width:22px}}

body{font:400 15px/1.5 var(--sans)}
header.top{background:var(--paper);color:var(--ink);border-bottom:3px solid var(--caioba-yellow);box-shadow:var(--shadow-sm)}

.btn{border-radius:var(--r-pill);text-transform:uppercase;letter-spacing:.02em;font-weight:800;padding:11px 20px;transition:transform var(--dur) var(--ease-out),background var(--dur)}
.btn:not(.ghost):not(.wa){box-shadow:var(--shadow-brand)}.btn:active{transform:scale(.97)}

.stage h2,.page h2,.cl-hello h1,.cart h3,.sheet h3{font-family:var(--disp);font-style:italic;font-weight:800;text-transform:uppercase;letter-spacing:-.01em}
.stage h2,.page h2{color:var(--caioba-blue)}
.grp{color:var(--caioba-blue);font-family:var(--disp);font-style:italic;font-weight:800;text-transform:uppercase}
.blocks button[aria-current="true"]{background:var(--hl);box-shadow:inset 4px 0 0 var(--caioba-yellow)}
.draw,.card,.cl-list{border-radius:var(--r-md)}.card{box-shadow:var(--shadow-sm)}
.hs{border-color:var(--caioba-blue);background:rgba(16,96,176,.06)}.hs:hover{background:rgba(16,96,176,.16)}
.hs.on{background:rgba(251,184,20,.6);border-color:var(--caioba-blue-900)}
.prow.on{background:var(--hl)}.prow .ref{border-color:var(--caioba-blue);color:var(--caioba-blue)}
.seg{border-radius:var(--r-pill)}.seg button[aria-pressed="true"]{background:var(--caioba-blue);color:#fff}
.chip[aria-pressed="true"],.cl-tabs button[aria-current="true"]{background:var(--caioba-blue);border-color:var(--caioba-blue);color:#fff}
select,input[type=text],input[type=tel],input[type=url],textarea{border-radius:var(--r-sm)}
.cart{border-top:3px solid var(--caioba-blue)}
.bar{background:var(--caioba-blue-900)}
.copy{border-color:var(--caioba-blue);color:var(--caioba-blue);border-radius:var(--r-pill)}
table.mw th{border-bottom-color:var(--caioba-blue)}
.client .cl-hello h1{color:var(--caioba-blue)}

.login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;background:var(--panel)}
.login-card{background:var(--paper);border:1px solid var(--line);border-radius:var(--r-md);box-shadow:var(--shadow-sm);padding:28px;width:100%;max-width:400px;text-align:center}
.login-card h2{font-family:var(--disp);font-style:italic;font-weight:800;text-transform:uppercase;color:var(--caioba-blue);margin:6px 0 2px;font-size:26px}
.login-card .f{text-align:left}.login-card input{width:100%}
.who{font:700 13px var(--sans);color:var(--ink);text-align:right;line-height:1.15}
.who small{display:block;font-weight:600;color:var(--steel)}
@media(max-width:720px){.who{display:none}}

const SALT='caioba-pecas-cg-2026';

let ME=null;
async function sha(t){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(t));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}
function session(){const s=store('sess');if(s&&s.exp>Date.now()){const u=USERS.find(u=>u.e===s.e);if(u)return u}return null}
function loginPage(err){
  $('#app').innerHTML=`<div class="login"><div class="login-card">
   <div class="logos" style="justify-content:center;margin-bottom:6px">${LOGOS}</div>
   <h2>Catálogo de peças</h2><p class="muted">Acesso da equipe Caiobá Honda</p>
   <div class="f" style="margin-top:14px"><label for="le">E-mail</label><input type="email" id="le" autocomplete="username" placeholder="nome@caiobahonda.com.br"></div>
   <div class="f" style="margin-top:10px"><label for="lp">Senha</label><input type="password" id="lp" autocomplete="current-password"></div>
   ${err?`<p style="color:var(--honda-red);font-weight:700;margin:10px 0 0">${esc(err)}</p>`:''}
   <button class="btn" id="lg" style="width:100%;margin-top:16px">Entrar</button>
  </div></div>`;
  const go=async()=>{const e=$('#le').value.trim().toLowerCase(),p=$('#lp').value;
    const h=await sha(e+':'+p+':'+SALT);const u=USERS.find(u=>u.e===e&&u.h===h);
    if(!u)return loginPage('E-mail ou senha incorretos.');
    store('sess',{e:u.e,exp:Date.now()+12*3600e3});ME=u;boot()};
  $('#lg').onclick=go;
  ['#le','#lp'].forEach(s=>$(s).onkeydown=ev=>{if(ev.key==='Enter')go()});
  $('#le').focus();
}
function logout(){try{localStorage.removeItem('cgcat:sess')}catch(e){};ME=null;S.cart=[];boot()}

/* ---------- data ---------- */
const LOADED={};
async function loadCat(tag){
  if(LOADED[tag])return LOADED[tag];
  const url=SRC[tag]||`data/${tag}.json`;
  const r=await fetch(url);if(!r.ok)throw new Error('HTTP '+r.status);
  const d=await r.json();d.by=Object.fromEntries(d.blocks.map(b=>[b.id,b]));LOADED[tag]=d;return d;
}
const vname=(cat,i)=>`${cat.linha} ${cat.vers[i].nome} ${cat.vers[i].ano}`;
const partsFor=(b,v)=>b.parts.filter(p=>p.q[v]>0);
const blocksFor=(cat,v)=>cat.blocks.filter(b=>partsFor(b,v).length);
const hsFor=(cat,b)=>store(`hs:${cat.tag}:${b.id}`)||b.hs;
function serNote(s){if(!s)return'';const m=s.replace(/\s+/g,' ').trim();if(/^~/.test(m))return'até o nº de série '+m.replace('~','').trim();if(/~$/.test(m))return'a partir do nº de série '+m.replace('~','').trim();return m}

/* ---------- state ---------- */
const pref=store('sel')||{};
const S={tab:'cat',linha:pref.linha||LINHAS[0],tag:pref.tag||null,v:pref.v??0,grp:'Motor',block:null,sel:null,cart:[],edit:false,editRef:null,client:null,mw:null,sheet:false,obs:''};
function fixSel(){
  const cs=CATS.filter(c=>c.linha===S.linha);
  if(!cs.find(c=>c.tag===S.tag))S.tag=cs[0].tag;
  if(S.v>=BYTAG[S.tag].vers.length)S.v=0;
  store('sel',{linha:S.linha,tag:S.tag,v:S.v});
}
function cartAdd(cat,p,b){const k=S.cart.find(x=>x.pn===p.pn);if(k)k.q+=1;else S.cart.push({pn:p.pn,d:p.d,vr:p.v,r:p.r,b:b.id,q:p.q[S.v]||1,tag:cat.tag,vn:vname(cat,S.v)})}
const cartHas=pn=>S.cart.some(x=>x.pn===pn);

/* ---------- drawing + list ---------- */
function drawHTML(cat,b,wm){
  if(!b.img)return `<div class="card muted" style="margin:0 0 12px">Este bloco não tem ilustração no catálogo. Use a lista de peças abaixo.</div>`;
  const hs=hsFor(cat,b);
  return `<div class="draw ${S.edit?'editing':''}" id="draw"><img src="${b.img}" width="${b.w}" height="${b.h}" alt="Ilustração ${esc(b.id)} ${esc(b.nome)}" draggable="false">
  ${hs.map((h,i)=>{const on=S.sel===h[0];const added=partsFor(b,S.v).some(p=>p.r===h[0]&&cartHas(p.pn));
   return `<button class="hs ${on?'on':''} ${added?'added':''}" style="left:${h[1]*100}%;top:${h[2]*100}%" data-ref="${h[0]}" data-i="${i}" aria-label="Item ${h[0]}"></button>`}).join('')}
  <div class="wm">${esc(wm)}</div></div>`;
}
function bindDraw(cat,b,rr){
  const d=$('#draw');if(!d)return;
  d.addEventListener('click',e=>{
    const t=e.target.closest('.hs');const key=`hs:${cat.tag}:${b.id}`;
    if(S.edit){
      if(t&&e.altKey){const hs=[...hsFor(cat,b)];hs.splice(+t.dataset.i,1);store(key,hs);rr();return}
      if(t){S.sel=t.dataset.ref;S.editRef=t.dataset.ref;rr();return}
      if(S.editRef){const r=d.getBoundingClientRect();store(key,[...hsFor(cat,b),[S.editRef,+((e.clientX-r.left)/r.width).toFixed(4),+((e.clientY-r.top)/r.height).toFixed(4)]]);rr()}
      return;
    }
    if(t){S.sel=S.sel===t.dataset.ref?null:t.dataset.ref;rr();setTimeout(()=>{const r=document.querySelector('.prow.on');if(r)r.scrollIntoView({block:'nearest',behavior:'smooth'})},0)}
  });
}
function partRows(b){
  const ps=partsFor(b,S.v);
  if(!ps.length)return `<div class="empty">Nenhuma peça deste bloco se aplica a esta versão.</div>`;
  return ps.map((p,i)=>{const on=S.sel===p.r,inC=cartHas(p.pn);
    const note=[p.v,serNote(p.s),p.q[S.v]>1?`${p.q[S.v]} por moto`:''].filter(Boolean).join(' · ');
    return `<div class="prow ${on?'on':''}"><button class="ref" data-sel="${esc(p.r)}" style="padding:0" aria-label="Mostrar item ${esc(p.r)}">${esc(p.r)}</button>
     <div><div class="d">${esc(p.d)}</div><div class="pn">${esc(p.pn)}</div>${note?`<div class="note">${esc(note)}</div>`:''}</div>
     <button class="add ${inC?'in':''}" data-add="${i}">${inC?'Na lista':'Adicionar'}</button></div>`}).join('');
}
function bindRows(cat,b,rr){
  document.querySelectorAll('[data-sel]').forEach(x=>x.onclick=()=>{S.sel=S.sel===x.dataset.sel?null:x.dataset.sel;if(S.edit)S.editRef=x.dataset.sel;rr()});
  const ps=partsFor(b,S.v);
  document.querySelectorAll('[data-add]').forEach(x=>x.onclick=()=>{const p=ps[+x.dataset.add];if(cartHas(p.pn))S.cart=S.cart.filter(c=>c.pn!==p.pn);else cartAdd(cat,p,b);rr()});
}
function cartHTML(){
  if(!S.cart.length)return `<div class="muted">Toque em um número do desenho ou em Adicionar para montar a lista.</div>`;
  return S.cart.map((c,i)=>`<div class="citem"><div><div>${esc(c.d)}${c.vr?` <span class="muted">${esc(c.vr)}</span>`:''}</div><div class="pn">${esc(c.pn)} · ${esc(c.vn)} · ${esc(c.b)} ref ${esc(c.r)}</div></div>
   <div class="qty"><button data-dq="${i}" aria-label="Diminuir">−</button><span>${c.q}</span><button data-iq="${i}" aria-label="Aumentar">+</button></div></div>`).join('');
}
function bindCart(rr){
  document.querySelectorAll('[data-dq]').forEach(x=>x.onclick=()=>{const c=S.cart[+x.dataset.dq];c.q--;if(c.q<1)S.cart.splice(+x.dataset.dq,1);rr()});
  document.querySelectorAll('[data-iq]').forEach(x=>x.onclick=()=>{S.cart[+x.dataset.iq].q++;rr()});
}

/* ---------- internal ---------- */
function header(){
  return `<header class="top"><div class="brand logos">${LOGOS}<span>Catálogo de peças<small>Linha CG</small></span></div>
  <nav class="tabs" role="tablist">${[['cat','Catálogo'],['link','Link para o cliente'],['mw','Lançar no MicroWork']].map(([k,l])=>`<button role="tab" aria-selected="${S.tab===k}" data-tab="${k}">${l}</button>`).join('')}</nav>
  <div class="who">${esc(ME.n)}<small>${esc(LOJAS[ME.l]||ME.l)}</small></div><button class="btn ghost" id="out">Sair</button></header>`;
}
function pickers(){
  const cs=CATS.filter(c=>c.linha===S.linha).sort((a,b)=>b.anos.localeCompare(a.anos));const cat=BYTAG[S.tag];
  return `<label for="pl">Linha</label><select id="pl">${LINHAS.map(l=>`<option ${l===S.linha?'selected':''}>${l}</option>`).join('')}</select>
   <label for="pc">Catálogo</label><select id="pc">${cs.map(c=>`<option value="${c.tag}" ${c.tag===S.tag?'selected':''}>${c.anos}</option>`).join('')}</select>
   <label for="pv">Versão</label><select id="pv">${cat.vers.map((v,i)=>`<option value="${i}" ${i===S.v?'selected':''}>${esc(v.nome)} ${esc(v.ano)} (${esc(v.c)})</option>`).join('')}</select>`;
}
function bindPickers(after){
  $('#pl').onchange=e=>{S.linha=e.target.value;S.tag=null;S.v=0;S.block=null;S.sel=null;fixSel();after()};
  $('#pc').onchange=e=>{S.tag=e.target.value;S.v=0;S.block=null;S.sel=null;fixSel();after()};
  $('#pv').onchange=e=>{S.v=+e.target.value;S.sel=null;fixSel();after()};
}
async function renderInternal(){
  fixSel();const app=$('#app');
  if(S.tab==='link'){app.innerHTML=header()+linkPage();bindTabs();bindLink();return}
  if(S.tab==='mw'){app.innerHTML=header()+mwPage();bindTabs();bindMw();return}
  let cat=LOADED[S.tag];
  if(!cat){app.innerHTML=header()+`<div class="verbar">${pickers()}</div><div class="empty">Carregando catálogo ${esc(BYTAG[S.tag].linha)} ${esc(BYTAG[S.tag].anos)}…</div>`;bindTabs();bindPickers(renderInternal);
    try{cat=await loadCat(S.tag)}catch(e){$('.empty').textContent='Não foi possível carregar este catálogo ('+e.message+'). Recarregue a página.';return}}
  const bl=blocksFor(cat,S.v);
  if(!S.block||!bl.find(b=>b.id===S.block))S.block=(bl.find(b=>b.grupo===S.grp)||bl[0]).id;
  const b=cat.by[S.block];const hs=hsFor(cat,b);
  const missing=[...new Set(partsFor(b,S.v).map(p=>p.r))].filter(r=>!hs.some(h=>h[0]===r));
  app.innerHTML=header()+`<div class="verbar">${pickers()}
    <span class="seg">${['Motor','Chassi'].map(g=>`<button aria-pressed="${S.grp===g}" data-grp="${g}">${g}</button>`).join('')}</span>
    ${ME.a?`<span style="margin-left:auto"><button class="btn ghost" id="edit">${S.edit?'Concluir ajuste':'Ajustar marcações'}</button></span>`:''}</div>
  <div class="cat"><div class="blocks">${['Motor','Chassi'].map(g=>{const xs=bl.filter(x=>x.grupo===g);return xs.length?`<div class="grp">${g}</div>`+xs.map(x=>`<button data-blk="${esc(x.id)}" aria-current="${x.id===S.block}"><span class="bid">${esc(x.id)}</span><span>${esc(x.nome)}</span></button>`).join(''):''}).join('')}</div>
   <div class="stage"><h2>${esc(b.id)} ${esc(b.nome)}</h2><p class="sub">${esc(vname(cat,S.v))}${b.aplic&&b.aplic!=='Todas'?' · bloco '+esc(b.aplic):''}</p>
    ${S.edit?`<div class="card" style="margin:0 0 12px"><b>Ajuste de marcações.</b> Escolha o item na lista (ou clique numa marcação) e clique no ponto do desenho. Alt+clique remove. ${missing.length?`<br><span class="muted">Sem marcação: ${missing.join(', ')}</span>`:''}${S.editRef?`<br>Marcando o item <b>${esc(S.editRef)}</b>.`:''}
     <div class="row" style="margin-top:8px"><button class="btn ghost" id="exp">Copiar marcações deste bloco</button><button class="btn ghost" id="rst">Voltar às automáticas</button></div></div>`:''}
    ${drawHTML(cat,b,'Catálogo Honda · uso interno Caiobá Honda')}</div>
   <div class="side"><div class="parts">${partRows(b)}</div>
    <div class="cart"><h3>Orçamento em montagem (${S.cart.reduce((a,c)=>a+c.q,0)})</h3>${cartHTML()}
    ${S.cart.length?`<div class="row" style="margin-top:10px"><button class="btn" id="tomw">Lançar no MicroWork</button><button class="btn ghost" id="clr">Limpar</button></div>`:''}</div></div></div>`;
  bindTabs();bindPickers(renderInternal);
  document.querySelectorAll('[data-grp]').forEach(x=>x.onclick=()=>{S.grp=x.dataset.grp;const f=bl.find(z=>z.grupo===S.grp);if(f)S.block=f.id;S.sel=null;renderInternal()});
  document.querySelectorAll('[data-blk]').forEach(x=>x.onclick=()=>{S.block=x.dataset.blk;S.grp=cat.by[S.block].grupo;S.sel=null;S.editRef=null;renderInternal()});
  if($('#edit'))$('#edit').onclick=()=>{S.edit=!S.edit;S.editRef=null;renderInternal()};
  if($('#exp'))$('#exp').onclick=async()=>{await copyTxt(JSON.stringify({[cat.tag+':'+b.id]:hsFor(cat,b)}));toast('Marcações copiadas')};
  if($('#rst'))$('#rst').onclick=()=>{try{localStorage.removeItem(`cgcat:hs:${cat.tag}:${b.id}`)}catch(e){};renderInternal()};
  bindDraw(cat,b,renderInternal);bindRows(cat,b,renderInternal);bindCart(renderInternal);
  if($('#tomw'))$('#tomw').onclick=()=>{S.mw={id:'BALCÃO',nome:'',vn:'',items:S.cart.map(c=>({...c})),obs:''};S.tab='mw';renderInternal()};
  if($('#clr'))$('#clr').onclick=()=>{S.cart=[];renderInternal()};
}
function bindTabs(){if($('#out'))$('#out').onclick=logout;document.querySelectorAll('[data-tab]').forEach(x=>x.onclick=()=>{S.tab=x.dataset.tab;renderInternal()})}

/* ---------- link ---------- */
const L={blocks:new Set(),nome:'',tel:'',loja:store('loja')||'',base:store('base')||location.href.split('#')[0],hrs:48,out:null,tag:null,v:null};
function linkPage(){
  const cat=LOADED[S.tag];
  if(L.tag!==S.tag||L.v!==S.v){L.blocks=new Set();L.out=null;L.tag=S.tag;L.v=S.v}
  const bl=cat?blocksFor(cat,S.v):[];
  return `<div class="page"><h2>Link de orçamento para o cliente</h2>
  <p class="muted">O cliente vê só os blocos marcados, da versão escolhida, até o link expirar.</p>
  <div class="card"><div class="row" style="gap:10px">${pickers()}</div>
  <div class="fgrid" style="margin-top:14px">
   <div class="f"><label for="ln">Nome do cliente</label><input type="text" id="ln" value="${esc(L.nome)}" placeholder="Ex.: João"></div>
   <div class="f"><label for="lt">WhatsApp do cliente (opcional)</label><input type="tel" id="lt" value="${esc(L.tel)}" placeholder="67 99999-0000"></div>
   <div class="f"><label for="lh">Validade do link</label><select id="lh">${[24,48,72,168].map(h=>`<option value="${h}" ${h===L.hrs?'selected':''}>${h<168?h+' horas':'7 dias'}</option>`).join('')}</select></div>
   <div class="f"><label for="ll">WhatsApp da loja (recebe o pedido)</label><input type="tel" id="ll" value="${esc(L.loja)}" placeholder="67 3000-0000"></div>
   <div class="f"><label for="lb">Endereço do portal</label><input type="url" id="lb" value="${esc(L.base)}"></div></div></div>
  ${cat?`<div class="card"><div class="row" style="justify-content:space-between"><b>Blocos que o cliente verá (${L.blocks.size})</b>
   <span class="row"><button class="chip" data-pre="Motor">Todo o motor</button><button class="chip" data-pre="Chassi">Todo o chassi</button><button class="chip" data-pre="all">Tudo</button><button class="chip" data-pre="none">Nenhum</button></span></div>
   ${['Motor','Chassi'].map(g=>`<div class="grp" style="padding-left:0">${g}</div><div class="chips">${bl.filter(b=>b.grupo===g).map(b=>`<button class="chip" aria-pressed="${L.blocks.has(b.id)}" data-lb="${esc(b.id)}"><b>${esc(b.id)}</b>${esc(b.nome)}</button>`).join('')}</div>`).join('')}</div>
  <div class="row"><button class="btn" id="gen" ${L.blocks.size?'':'disabled'}>Gerar link</button></div>`:`<div class="empty">Carregando catálogo…</div>`}
  ${L.out?`<div class="card"><b>Orçamento ${L.out.id}</b> <span class="muted">válido até ${new Date(L.out.e).toLocaleString('pt-BR')}</span>
    <div class="linkbox" style="margin:10px 0">${esc(L.out.url)}</div>
    <div class="row"><button class="btn ghost" id="cpl">Copiar link</button><button class="btn wa" id="wal">Enviar pelo WhatsApp</button><button class="btn ghost" id="prv">Ver como o cliente</button></div></div>`:''}</div>`;
}
function bindLink(){
  if(!LOADED[S.tag]){loadCat(S.tag).then(renderInternal).catch(()=>{});}
  bindPickers(renderInternal);
  const sv=()=>{L.nome=$('#ln').value;L.tel=$('#lt').value;L.hrs=+$('#lh').value;L.loja=$('#ll').value;L.base=$('#lb').value;store('loja',L.loja);store('base',L.base)};
  ['#ln','#lt','#lh','#ll','#lb'].forEach(s=>$(s).onchange=sv);
  const cat=LOADED[S.tag];if(!cat)return;
  document.querySelectorAll('[data-lb]').forEach(x=>x.onclick=()=>{sv();const k=x.dataset.lb;L.blocks.has(k)?L.blocks.delete(k):L.blocks.add(k);L.out=null;renderInternal()});
  document.querySelectorAll('[data-pre]').forEach(x=>x.onclick=()=>{sv();const p=x.dataset.pre;L.blocks=new Set(p==='none'?[]:blocksFor(cat,S.v).filter(b=>p==='all'||b.grupo===p).map(b=>b.id));L.out=null;renderInternal()});
  $('#gen').onclick=()=>{sv();const id=Math.random().toString(36).slice(2,7).toUpperCase();const e=Date.now()+L.hrs*3600e3;
    L.out={id,e,url:L.base.split('#')[0]+'#c='+b64e({id,t:S.tag,v:S.v,b:[...L.blocks],n:L.nome.trim(),e,w:L.loja.replace(/\D/g,'')})};renderInternal()};
  if(L.out){
    $('#cpl').onclick=async()=>{await copyTxt(L.out.url);toast('Link copiado')};
    $('#wal').onclick=()=>{const t=`Olá${L.nome?' '+L.nome.trim():''}! Aqui é da *Caiobá Honda*.\n\nPelo link abaixo você vê os desenhos das peças da sua *${vname(cat,S.v)}*. É só tocar nos números das peças que precisa e enviar a lista pra gente.\n\nO link vale até ${new Date(L.out.e).toLocaleString('pt-BR',{dateStyle:'short',timeStyle:'short'})}.\n\n${L.out.url}`;
      const ph=L.tel.replace(/\D/g,'');window.open(`https://wa.me/${ph?(ph.length<=11?'55'+ph:ph):''}?text=${encodeURIComponent(t)}`,'_blank')};
    $('#prv').onclick=()=>{store('prev',true);location.hash=L.out.url.split('#')[1]};
  }
}

/* ---------- MicroWork ---------- */
function parseMsg(t){
  const items=[];const re=/(\d+)\s*x\s+(.+?)\s*\((\d{5}-[0-9A-Z]{3,5}(?:-[0-9A-Z]{1,6})?|\d{5}-\d{7})\)/g;let x;
  while((x=re.exec(t)))items.push({q:+x[1],d:x[2].replace(/\*/g,'').trim(),pn:x[3],vr:''});
  if(!items.length)return null;
  const h=t.match(/Orçamento\s+([A-Z0-9]+)(?:\s*-\s*([^*\n]+))?/);const vn=(t.split('\n').map(s=>s.replace(/\*/g,'').trim()).find(s=>/^CG \d{3}/.test(s))||'');
  const ob=t.match(/Obs:\s*([\s\S]*)$/);
  return{id:h?h[1]:'—',nome:h&&h[2]?h[2].trim():'',vn,obs:ob?ob[1].trim():'',items};
}
function mwPage(){
  const o=S.mw;
  return `<div class="page"><h2>Lançar no MicroWork</h2>
  <p class="muted">Cole a mensagem que o cliente enviou pelo WhatsApp. Para cada linha: copie o código, cole no campo Mercadoria, escolha o estoque, ajuste a quantidade e clique em Adicionar.</p>
  <div class="card"><div class="f"><label for="msg">Mensagem do cliente</label><textarea id="msg" rows="5" placeholder="Cole aqui a mensagem inteira"></textarea></div>
   <div class="row" style="margin-top:10px"><button class="btn" id="rd">Ler orçamento</button></div></div>
  ${o?`<div class="card"><div class="row" style="justify-content:space-between"><div><b>Orçamento ${esc(o.id)}</b> ${o.nome?'· '+esc(o.nome):''} ${o.vn?'· '+esc(o.vn):''}<div class="muted">${o.items.filter(i=>i.done).length} de ${o.items.length} lançados</div></div>
     <button class="btn ghost" id="res">Copiar resumo</button></div>
   ${o.obs?`<p><b>Observação do cliente:</b> ${esc(o.obs)}</p>`:''}
   <div style="overflow-x:auto"><table class="mw"><thead><tr><th></th><th>Código (MicroWork)</th><th>Qtd.</th><th>Descrição</th></tr></thead><tbody>
   ${o.items.map((it,i)=>`<tr class="${it.done?'done':''}"><td><input type="checkbox" data-dn="${i}" ${it.done?'checked':''} aria-label="Lançado"></td>
    <td class="cp"><div class="row"><span class="code">${esc(nohy(it.pn))}</span><button class="copy" data-cp="${i}">Copiar</button></div></td>
    <td class="qbig">${it.q}</td><td>${esc(it.d)}${it.vr?`<div class="muted">${esc(it.vr)}</div>`:''}${it.vn?`<div class="muted">${esc(it.vn)}</div>`:''}</td></tr>`).join('')}
   </tbody></table></div></div>`:''}</div>`;
}
function bindMw(){
  $('#rd').onclick=()=>{const o=parseMsg($('#msg').value);if(!o){toast('Não achei itens nessa mensagem');return}S.mw=o;renderInternal()};
  const o=S.mw;if(!o)return;
  document.querySelectorAll('[data-dn]').forEach(x=>x.onchange=()=>{o.items[+x.dataset.dn].done=x.checked;renderInternal()});
  document.querySelectorAll('[data-cp]').forEach(x=>x.onclick=async()=>{const i=+x.dataset.cp;await copyTxt(nohy(o.items[i].pn));o.items[i].done=true;renderInternal();const b=document.querySelector(`[data-cp="${i}"]`);if(b){b.classList.add('ok');b.textContent='Copiado'}});
  $('#res').onclick=async()=>{await copyTxt(`Orçamento ${o.id}${o.nome?' - '+o.nome:''}${o.vn?'\n'+o.vn:''}\n\n`+o.items.map(i=>`${i.q}x ${nohy(i.pn)} ${i.d}`).join('\n')+(o.obs?`\n\nObs: ${o.obs}`:''));toast('Resumo copiado')};
}

/* ---------- client ---------- */
async function renderClient(){
  const c=S.client,app=$('#app');document.body.classList.add('client');
  const hdr=`<header class="top"><div class="brand logos">${LOGOS}<span>Orçamento<small>${esc(c.id)}</small></span></div>${store('prev')?'<button class="btn ghost" id="bk" style="margin-left:auto;color:#fff;border-color:#fff">Voltar ao portal interno</button>':''}</header>`;
  if(Date.now()>c.e||!BYTAG[c.t]){app.innerHTML=hdr+`<div class="expired"><h2 style="font:700 26px var(--cond)">Este link expirou</h2><p class="muted">Peça um novo link ao seu vendedor da Caiobá Honda pelo WhatsApp.</p></div>`;bindBack();return}
  let cat=LOADED[c.t];
  if(!cat){app.innerHTML=hdr+`<div class="empty">Carregando…</div>`;try{cat=await loadCat(c.t)}catch(e){$('.empty').textContent='Não foi possível carregar. Tente abrir o link novamente.';return}}
  S.v=c.v;const bl=c.b.map(k=>cat.by[k]).filter(Boolean);
  if(!S.block||!c.b.includes(S.block))S.block=bl[0].id;
  const b=cat.by[S.block];const n=S.cart.reduce((a,x)=>a+x.q,0);
  app.innerHTML=hdr+`<div class="cl-hello"><h1>${c.n?esc(c.n)+', escolha':'Escolha'} as peças da sua ${esc(vname(cat,c.v))}</h1><p>Toque no número da peça no desenho ou em Adicionar na lista. Quando terminar, envie a lista pelo WhatsApp.</p></div>
  ${bl.length>1?`<div class="cl-tabs">${bl.map(x=>`<button data-cb="${esc(x.id)}" aria-current="${x.id===S.block}">${esc(x.nome)}</button>`).join('')}</div>`:''}
  <div class="cl-main">${drawHTML(cat,b,'Caiobá Honda · orçamento '+c.id)}<div class="cl-list">${partRows(b)}</div></div>
  <div class="bar"><div><b>${n} ${n===1?'peça':'peças'}</b> na sua lista</div><button class="btn" id="rev" ${n?'':'disabled'}>Revisar e enviar</button></div>
  ${S.sheet?`<div class="sheet" id="sh"><div class="in" role="dialog" aria-label="Sua lista"><h3>Sua lista</h3>${cartHTML()}
    <div class="f" style="margin-top:12px"><label for="obs">Observação (opcional)</label><textarea id="obs" rows="3" placeholder="Ex.: não tenho certeza se é essa peça">${esc(S.obs)}</textarea></div>
    <div class="row" style="margin-top:12px"><button class="btn wa" id="snd">Enviar pelo WhatsApp</button><button class="btn ghost" id="cls">Continuar escolhendo</button></div></div></div>`:''}`;
  bindBack();
  document.querySelectorAll('[data-cb]').forEach(x=>x.onclick=()=>{S.block=x.dataset.cb;S.sel=null;renderClient();scrollTo({top:0})});
  bindDraw(cat,b,renderClient);bindRows(cat,b,renderClient);
  $('#rev').onclick=()=>{S.sheet=true;renderClient()};
  if(S.sheet){bindCart(renderClient);$('#obs').oninput=e=>S.obs=e.target.value;$('#cls').onclick=()=>{S.sheet=false;renderClient()};
    $('#sh').onclick=e=>{if(e.target.id==='sh'){S.sheet=false;renderClient()}};
    $('#snd').onclick=()=>{const t=`*Orçamento ${c.id}${c.n?' - '+c.n:''}*\n*${vname(cat,c.v)}*\n\n`+S.cart.map(x=>`${x.q}x ${x.d}${x.vr?' '+x.vr:''} (${x.pn})`).join('\n')+(S.obs?`\n\nObs: ${S.obs}`:'');
      window.open(`https://wa.me/${c.w?(c.w.length<=11?'55'+c.w:c.w):''}?text=${encodeURIComponent(t)}`,'_blank')};}
}
function bindBack(){if($('#bk'))$('#bk').onclick=()=>{try{localStorage.removeItem('cgcat:prev')}catch(e){};S.cart=[];history.replaceState(null,'',location.pathname+location.search);boot()}}

function boot(){
  const h=location.hash;
  if(h.startsWith('#c=')){try{S.client=b64d(h.slice(3));S.cart=[];S.block=null;S.sel=null;S.edit=false;S.sheet=false;renderClient();return}catch(e){}}
  document.body.classList.remove('client');S.client=null;S.block=null;
  ME=session();if(!ME){loginPage();return}
  renderInternal();
}
addEventListener('hashchange',boot);boot();
</script></body></html>
